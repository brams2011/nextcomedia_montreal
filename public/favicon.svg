<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#040814" />
    </linearGradient>

    <!-- Orbit Gradient -->
    <linearGradient id="favOrbit" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- 3D Blue Ribbon Body Gradient -->
    <linearGradient id="favBlueBody" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Specular Highlight -->
    <linearGradient id="favSpecular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#e0f2fe" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </linearGradient>

    <!-- Purple Ascending Pillar Gradient -->
    <linearGradient id="favPurpleBody" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="30%" stop-color="#7c3aed" />
      <stop offset="75%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f0abfc" />
    </linearGradient>

    <linearGradient id="favPurpleSpec" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f5d0fe" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded Squircle Background -->
  <rect width="128" height="128" rx="28" fill="url(#favBg)" />

  <!-- Center Group -->
  <g transform="translate(64, 64) scale(0.95) translate(-60, -60)">
    <!-- Circular Orbit Swooshes -->
    <path 
      d="M 36 28 C 54 13 82 17 96 34 C 104 46 104 60 98 72" 
      fill="none" 
      stroke="url(#favOrbit)" 
      stroke-width="7" 
      stroke-linecap="round" 
    />
    <path 
      d="M 22 56 C 18 70 24 84 36 93 C 52 104 76 103 92 90" 
      fill="none" 
      stroke="url(#favOrbit)" 
      stroke-width="7" 
      stroke-linecap="round" 
    />

    <!-- 3D Letter N -->
    <path 
      d="M 30 72 L 48 30 C 50 25 56 25 58 30 L 68 74" 
      fill="none" 
      stroke="url(#favBlueBody)" 
      stroke-width="17" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <path 
      d="M 30 72 L 48 30 C 50 25 56 25 58 30 L 68 74" 
      fill="none" 
      stroke="url(#favSpecular)" 
      stroke-width="5" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      opacity="0.9" 
    />
    <line 
      x1="66" 
      y1="74" 
      x2="88" 
      y2="22" 
      stroke="url(#favPurpleBody)" 
      stroke-width="17" 
      stroke-linecap="round" 
    />
    <line 
      x1="66" 
      y1="74" 
      x2="88" 
      y2="22" 
      stroke="url(#favPurpleSpec)" 
      stroke-width="4.5" 
      stroke-linecap="round" 
    />
  </g>
</svg>
