<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Orbit Gradient (Vibrant Cyan to Deep Blue) -->
    <linearGradient id="symOrbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- 3D Blue Ribbon Body Gradient -->
    <linearGradient id="symBlueBody" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- 3D Blue Tube Specular Highlight (Ridge reflection) -->
    <linearGradient id="symBlueSpecular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#e0f2fe" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </linearGradient>

    <!-- Purple Ascending Pillar Gradient -->
    <linearGradient id="symPurpleBody" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="30%" stop-color="#7c3aed" />
      <stop offset="75%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#d8b4fe" />
    </linearGradient>

    <!-- Purple Pillar Specular Line -->
    <linearGradient id="symPurpleSpecular" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#f5d0fe" stop-opacity="0.9" />
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="sym3DDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0b1329" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Circular Orbit Swooshes (Background) -->
  <g opacity="0.95">
    <!-- Top-Right Orbit Crescent -->
    <path 
      d="M 36 28 C 54 13 82 17 96 34 C 104 46 104 60 98 72" 
      fill="none" 
      stroke="url(#symOrbitGrad)" 
      stroke-width="6.5" 
      stroke-linecap="round" 
    />
    <!-- Bottom-Left Orbit Crescent -->
    <path 
      d="M 22 56 C 18 70 24 84 36 93 C 52 104 76 103 92 90" 
      fill="none" 
      stroke="url(#symOrbitGrad)" 
      stroke-width="6.5" 
      stroke-linecap="round" 
    />
  </g>

  <!-- 3D Letter N Assembly -->
  <g filter="url(#sym3DDepth)">
    <!-- Main Blue Ribbon Base (Tube silhouette) -->
    <path 
      d="M 30 72 L 48 30 C 50 25 56 25 58 30 L 68 74" 
      fill="none" 
      stroke="url(#symBlueBody)" 
      stroke-width="17" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Main Blue Ribbon Specular Upper Highlight (gives 3D cylinder volume) -->
    <path 
      d="M 30 72 L 48 30 C 50 25 56 25 58 30 L 68 74" 
      fill="none" 
      stroke="url(#symBlueSpecular)" 
      stroke-width="5" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      opacity="0.85" 
    />

    <!-- Purple Ascending Pillar (Upper right stroke) -->
    <line 
      x1="66" 
      y1="74" 
      x2="88" 
      y2="22" 
      stroke="url(#symPurpleBody)" 
      stroke-width="17" 
      stroke-linecap="round" 
    />

    <!-- Purple Pillar Specular Line -->
    <line 
      x1="66" 
      y1="74" 
      x2="88" 
      y2="22" 
      stroke="url(#symPurpleSpecular)" 
      stroke-width="4.5" 
      stroke-linecap="round" 
    />
  </g>
</svg>
