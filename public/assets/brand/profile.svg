<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="profBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141d3d" />
      <stop offset="60%" stop-color="#0b1024" />
      <stop offset="100%" stop-color="#050711" />
    </radialGradient>

    <linearGradient id="profRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="profOrbit" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="profBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="profPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="60%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d8b4fe" />
    </linearGradient>

    <filter id="profGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Avatar Background -->
  <circle cx="100" cy="100" r="96" fill="url(#profBg)" stroke="url(#profRing)" stroke-width="3" />

  <!-- Orbit Rings -->
  <path d="M 64 68 C 76 52 108 52 126 66 C 136 76 142 90 139 104" fill="none" stroke="url(#profOrbit)" stroke-width="6" stroke-linecap="round" opacity="0.9" />
  <path d="M 52 86 C 46 102 52 120 66 130 C 82 142 114 144 132 130" fill="none" stroke="url(#profOrbit)" stroke-width="6" stroke-linecap="round" opacity="0.9" />

  <!-- 3D N ribbon -->
  <g filter="url(#profGlow)">
    <path d="M 60 98 C 58 84 66 72 78 70 C 87 69 95 75 101 83 L 115 105 C 119 111 119 118 114 123 C 109 128 101 127 96 119 L 75 87" fill="none" stroke="url(#profBlue)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="100" y1="122" x2="132" y2="70" stroke="url(#profPurple)" stroke-width="14" stroke-linecap="round" />
    <line x1="100" y1="122" x2="132" y2="70" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5" />
  </g>
</svg>
